name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Transfer engine tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run engine unit + loopback integration tests and benchmark
        run: ./gradlew -PcoreOnly :core:test --stacktrace -Dstarlane.largeFileMb=512
      - name: Publish benchmark to job summary
        if: always()
        run: |
          if [ -f core/build/reports/starlane/benchmark.md ]; then cat core/build/reports/starlane/benchmark.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload engine test reports and benchmarks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/
            core/build/test-results/

  app:
    name: Build APKs, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + optimized APKs
        run: ./gradlew :app:assembleDebug :app:assembleOptimized --stacktrace
      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: APK sizes
        if: always()
        run: |
          echo "### APK sizes" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} \; | awk '{print "- " $9 ": " $5 " bytes"}' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starlane-share-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload optimized APK (R8, debug-signed, for testing)
        uses: actions/upload-artifact@v4
        with:
          name: starlane-share-optimized-apk
          path: app/build/outputs/apk/optimized/*.apk
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: |
            app/build/reports/
            app/build/test-results/
